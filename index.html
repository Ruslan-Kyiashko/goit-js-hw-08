<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    
    <!-- Підключення стилів basicLightbox через jsDelivr -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/basiclightbox@5.0.4/dist/basicLightbox.min.css"
    />

    <!-- Підключаємо стилі -->
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>

    <!-- Контейнер галереї згідно з вимогою завдання -->
    <ul class="gallery"></ul>

    <!-- Підключення скрипта бібліотеки basicLightbox -->
    <script src="https://cdn.jsdelivr.net/npm/basiclightbox@5.0.4/dist/basicLightbox.min.js"></script>

    <!-- Підключаємо основний скрипт з атрибутом type="module" -->
    <script src="./js/gallery.js" type="module"></script>
  </body>
</html>
